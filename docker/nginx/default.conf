# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name ibrahem-basem.duckdns.org;
    return 301 https://$host$request_uri;
}
# HTTPS server
server {
    listen 443 ssl;
    server_name ibrahem-basem.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/ibrahem-basem.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ibrahem-basem.duckdns.org/privkey.pem;
    location / {
        proxy_pass http://fastapi:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /telemetry_x7b92mq {
        proxy_pass http://fastapi:8000/telemetry_x7b92mq;
    }
}
